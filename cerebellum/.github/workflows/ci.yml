name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: node --check admin/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate-monorepo.py
      - run: python -m unittest discover -s benchmarks/verify -p "test_*.py" -v
      - run: |
          $env:PYTHONPATH = "workers/skillopt-reference/src"
          python -m unittest discover -s workers/skillopt-reference/tests -p "test_*.py" -v
      - run: |
          $env:PYTHONPATH = "workers/web-acquisition/src"
          python -m unittest discover -s workers/web-acquisition/tests -p "test_*.py" -v
      - run: |
          python -m pip install --disable-pip-version-check ./workers/meta-training
          $env:PYTHONPATH = "workers/meta-training/src"
          python -m unittest discover -s workers/meta-training/tests -p "test_*.py" -v
      - run: |
          python -m pip install --disable-pip-version-check pytest
          $env:PYTHONPATH = "workers/social-acquisition/src"
          python -m pytest workers/social-acquisition/tests -q

  evolver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --disable-pip-version-check
          pytest pytest-asyncio numpy click jinja2 pymysql hnswlib
      - run: python -m pip install --disable-pip-version-check --no-deps -e ./components/evolver
      - run: python -m pytest tests -q
        working-directory: components/evolver
  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --disable-pip-version-check
          pytest pytest-cov pytest-asyncio numpy click jinja2 pymysql hnswlib
      - run: >-
          python -m pip install --disable-pip-version-check
          --no-deps -e ./components/evolver
          ./workers/skillopt-reference ./workers/meta-training
          ./workers/web-acquisition ./workers/social-acquisition
      - run: powershell -NoProfile -File scripts/coverage.ps1
