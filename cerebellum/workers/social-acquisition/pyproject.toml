[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebellum-social-acquisition-worker"
version = "0.1.0"
description = "Isolated social platform and paper discovery worker for Cerebellum v3"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
cerebellum-social-acquisition-worker = "cerebellum_social_acquisition.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
