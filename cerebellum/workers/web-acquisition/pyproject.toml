[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebellum-web-acquisition-worker"
version = "0.1.0"
description = "Isolated failure-driven web acquisition worker for Cerebellum v3"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
crawl4ai = ["crawl4ai==0.9.2"]
scrapling = ["scrapling[all]==0.4.8"]
test = ["pytest==8.4.2"]

[project.scripts]
cerebellum-web-acquisition-worker = "cerebellum_web_acquisition.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
